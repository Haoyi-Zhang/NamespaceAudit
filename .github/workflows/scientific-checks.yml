name: Scientific checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run the whole finite reproduction with bounded resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scientific-output
          ulimit -v 4194304
          ulimit -t 780
          timeout --signal=TERM --kill-after=5s 60s \
            python -B tests/regression_exposure_reuse.py \
            2>&1 | tee scientific-output/exposure-reuse.log
          timeout --signal=TERM --kill-after=10s 780s \
            python -B src/reproduce.py --out scientific-output/reproduction \
            2>&1 | tee scientific-output/console.log
      - name: Upload raw output, including failed and partial runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-raw-output
          path: scientific-output/
          if-no-files-found: error
          retention-days: 14
